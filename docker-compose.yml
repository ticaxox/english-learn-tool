name: ${COMPOSE_PROJECT_NAME:-english-learn}

x-backend-build: &backend-build
  context: .
  dockerfile: deploy/backend/Dockerfile

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  APP_NAME: ${APP_NAME:-AI English Learning Tool}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY is required}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2.0}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  WORDBOOK_STORAGE_DIR: /app/var/wordbooks
  COACH_UPLOAD_DIR: /app/var/coach
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-wordbook-volume: &wordbook-volume
  type: volume
  source: wordbook-data
  target: /app/var/wordbooks

x-coach-volume: &coach-volume
  type: volume
  source: coach-data
  target: /app/var/coach

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-english_learn}
      POSTGRES_USER: ${POSTGRES_USER:-english_learn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    shm_size: 128mb

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *app-security
    image: ${API_IMAGE:-english-learn-api:local}
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-security
    image: ${API_IMAGE:-english-learn-api:local}
    build: *backend-build
    environment: *backend-environment
    volumes:
      - *wordbook-volume
      - *coach-volume
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *app-security
    image: ${API_IMAGE:-english-learn-api:local}
    environment: *backend-environment
    volumes:
      - *wordbook-volume
      - *coach-volume
    command: ["arq", "app.workers.worker.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/deploy/health/check_arq_health.py", "english-learn:worker-health"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 45s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    <<: *app-security
    image: ${API_IMAGE:-english-learn-api:local}
    environment: *backend-environment
    volumes:
      - *wordbook-volume
      - *coach-volume
    command: ["arq", "app.workers.scheduler.SchedulerSettings"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 5s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    <<: *app-security
    image: ${FRONTEND_IMAGE:-english-learn-frontend:local}
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  reverse-proxy:
    <<: *app-security
    image: ${REVERSE_PROXY_IMAGE:-english-learn-reverse-proxy:local}
    build:
      context: .
      dockerfile: deploy/reverse-proxy/Dockerfile
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  wordbook-data:
  coach-data:
