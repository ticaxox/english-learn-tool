name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: english_learn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d english_learn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/english_learn_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/english_learn_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.28
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Create isolated test database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres english_learn_test
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .
      - name: Pytest with real PostgreSQL and Redis
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm test

  security:
    name: Sensitive information scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          -v "${PWD}:/repo:ro"
          zricethezav/gitleaks:v8.24.2
          git /repo
          --config=/repo/deploy/security/gitleaks.toml
          --redact --verbose --exit-code=1 --no-banner

  compose:
    name: Compose build, storage, migration, startup and health checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALLOW_INSECURE_EXAMPLE_ENV: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable environment
        run: |
          cp .env.example .env
          sed -i "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=english-learn-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/" .env
          sed -i "s/^DEPLOYMENT_PROFILE=.*/DEPLOYMENT_PROFILE=local-lightweight/" .env
      - name: Show tool versions
        run: |
          docker --version
          docker compose version
          python --version
      - name: Validate Compose resolution
        run: docker compose --env-file .env config --quiet
      - name: Validate wordbook storage contract
        run: |
          python -m unittest discover -s deploy/tests -p "test_*.py" -v
          python deploy/tests/check_compose_storage.py --env-file .env --compose-file docker-compose.yml
      - name: Validate production profile contract
        env:
          DEPLOYMENT_PROFILE: lightweight
          EDGE_PORT: "8090"
          LIGHTWEIGHT_MEMORY_BUDGET_MB: "528"
        run: |
          python deploy/scripts/validate_release_manifest.py deploy/tests/fixtures/release-manifest.json --write-env /tmp/release.env
          set -a
          . /tmp/release.env
          set +a
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f deploy/compose.prod.yml \
            -f deploy/compose.lightweight.yml \
            -f deploy/compose.tunnel.yml \
            config --format json > /tmp/compose-production.json
          python deploy/tests/check_production_contract.py \
            /tmp/compose-production.json \
            --memory-budget-mb 528
      - name: Shell script syntax
        run: |
          shellcheck --version
          shellcheck -x -e SC1091 deploy/scripts/*.sh
      - name: Build, migrate and verify
        run: ./deploy/scripts/start-stack.sh
      - name: Verify cross-container wordbook storage
        env:
          EVIDENCE_FILE: deploy/backups/wordbook-storage-evidence.json
        run: ./deploy/scripts/verify-wordbook-storage.sh
      - name: Show Compose state
        run: docker compose --env-file .env ps
      - name: Collect failure diagnostics
        if: failure()
        run: |
          docker compose --env-file .env ps -a
          docker compose --env-file .env logs --no-color --tail=200
      - name: Upload wordbook storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordbook-storage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy/backups/wordbook-storage-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable Compose project and volumes
        if: always()
        run: |
          if [[ -f .env ]]; then
            docker compose --env-file .env down --volumes --remove-orphans
          fi
