name: Release images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release tag to create on main, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}
  IMAGE_PLATFORM: linux/amd64
  POSTGRES_IMAGE: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
  REDIS_IMAGE: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
  CLOUDFLARED_IMAGE: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39

jobs:
  publish:
    name: Publish immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
          else
            test "$GITHUB_REF" = "refs/tags/$RELEASE_VERSION"
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Create release tag from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "Tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION" "$RELEASE_COMMIT"
          git push origin "refs/tags/$RELEASE_VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/english-learn-api
          tags: |
            type=raw,value=${{ env.RELEASE_COMMIT }}
            type=raw,value=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Resolve frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/english-learn-frontend
          tags: |
            type=raw,value=${{ env.RELEASE_COMMIT }}
            type=raw,value=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Resolve reverse proxy image metadata
        id: proxy-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/english-learn-reverse-proxy
          tags: |
            type=raw,value=${{ env.RELEASE_COMMIT }}
            type=raw,value=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Build and push reverse proxy image
        id: proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/reverse-proxy/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ steps.proxy-meta.outputs.tags }}
          labels: ${{ steps.proxy-meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      - name: Create release manifest
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          REVERSE_PROXY_DIGEST: ${{ steps.proxy.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          version = os.environ["RELEASE_VERSION"]
          commit = os.environ["RELEASE_COMMIT"]
          manifest = {
              "schema_version": 1,
              "release": version,
              "source_commit": commit,
              "created_at": dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z"),
              "platform": os.environ["IMAGE_PLATFORM"],
              "images": {
                  "api": f"ghcr.io/{owner}/english-learn-api@{os.environ['API_DIGEST']}",
                  "frontend": f"ghcr.io/{owner}/english-learn-frontend@{os.environ['FRONTEND_DIGEST']}",
                  "reverse_proxy": f"ghcr.io/{owner}/english-learn-reverse-proxy@{os.environ['REVERSE_PROXY_DIGEST']}",
              },
              "runtime_images": {
                  "postgres": os.environ["POSTGRES_IMAGE"],
                  "redis": os.environ["REDIS_IMAGE"],
                  "cloudflared": os.environ["CLOUDFLARED_IMAGE"],
              },
          }
          Path("dist/release-manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
          python3 deploy/scripts/validate_release_manifest.py dist/release-manifest.json \
            --expected-release "$RELEASE_VERSION" \
            --expected-commit "$RELEASE_COMMIT"

      - name: Create image bundle and checksums
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          REVERSE_PROXY_DIGEST: ${{ steps.proxy.outputs.digest }}
        run: |
          set -euo pipefail
          api="ghcr.io/${GITHUB_REPOSITORY_OWNER}/english-learn-api@${API_DIGEST}"
          frontend="ghcr.io/${GITHUB_REPOSITORY_OWNER}/english-learn-frontend@${FRONTEND_DIGEST}"
          proxy="ghcr.io/${GITHUB_REPOSITORY_OWNER}/english-learn-reverse-proxy@${REVERSE_PROXY_DIGEST}"
          docker pull "$api"
          docker pull "$frontend"
          docker pull "$proxy"
          docker pull "$POSTGRES_IMAGE"
          docker pull "$REDIS_IMAGE"
          docker pull "$CLOUDFLARED_IMAGE"
          docker save -o dist/english-learn-images.tar \
            "$api" "$frontend" "$proxy" "$POSTGRES_IMAGE" "$REDIS_IMAGE" "$CLOUDFLARED_IMAGE"
          (
            cd dist
            sha256sum release-manifest.json english-learn-images.tar > SHA256SUMS
          )

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_VERSION }}
          path: |
            dist/release-manifest.json
            dist/english-learn-images.tar
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" \
            dist/release-manifest.json \
            dist/SHA256SUMS \
            --title "English Learning Tool $RELEASE_VERSION" \
            --notes "Immutable images for $RELEASE_VERSION at commit $RELEASE_COMMIT. Verify attached SHA256SUMS before installation." \
            --verify-tag \
            "${prerelease[@]}"
