# Constrained demo profile for a 1 vCPU / 1 GiB host with existing system services.
# These are hard caps, not a claim that the host meets the standard production baseline.
services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - wal_buffers=4MB
    shm_size: 32mb
    mem_limit: 104m
    mem_swappiness: 0
    cpus: 0.20
    pids_limit: 96

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 24mb
      - --maxmemory-policy
      - noeviction
    mem_limit: 40m
    mem_swappiness: 0
    cpus: 0.05
    pids_limit: 64

  migrate:
    mem_limit: 144m
    cpus: 0.25
    pids_limit: 96

  api:
    mem_limit: 136m
    mem_swappiness: 0
    cpus: 0.25
    pids_limit: 128

  worker:
    mem_limit: 96m
    mem_swappiness: 0
    cpus: 0.20
    pids_limit: 96

  scheduler:
    mem_limit: 72m
    mem_swappiness: 0
    cpus: 0.15
    pids_limit: 64

  frontend:
    mem_limit: 16m
    mem_swappiness: 0
    cpus: 0.02
    pids_limit: 32

  reverse-proxy:
    mem_limit: 16m
    mem_swappiness: 0
    cpus: 0.02
    pids_limit: 32
