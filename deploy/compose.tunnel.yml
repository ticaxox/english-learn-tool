# Optional ephemeral HTTPS demo ingress. No host ports and no existing proxy changes.
services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?CLOUDFLARED_IMAGE is required}
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://reverse-proxy:8080
    environment:
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    depends_on:
      reverse-proxy:
        condition: service_healthy
    mem_limit: 48m
    mem_swappiness: 0
    cpus: 0.05
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"